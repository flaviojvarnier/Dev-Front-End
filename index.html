<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro de tarefas de projetos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Tarefas acadêmicas</h1>
    </header>

    <main>
      <section>
        <h2>Busca e filtros</h2>

        <form>
          <div>
            <label for="busca-titulo">Buscar por título da tarefa</label>
            <input type="search" id="busca-titulo" name="busca-titulo" />
          </div>

          <fieldset>
            <legend>Filtrar por status</legend>

            <div>
              <input
                type="radio"
                id="filtro-status-todos"
                name="filtro-status"
                value="todos"
                checked
              />
              <label for="filtro-status-todos">Todos</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-status-a-fazer"
                name="filtro-status"
                value="a-fazer"
              />
              <label for="filtro-status-a-fazer">A fazer</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-status-em-andamento"
                name="filtro-status"
                value="em-andamento"
              />
              <label for="filtro-status-em-andamento">Em andamento</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-status-em-revisao"
                name="filtro-status"
                value="em-revisao"
              />
              <label for="filtro-status-em-revisao">Em revisão</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-status-concluida"
                name="filtro-status"
                value="concluida"
              />
              <label for="filtro-status-concluida">Concluída</label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Filtrar por prioridade</legend>

            <div>
              <input
                type="radio"
                id="filtro-prioridade-todas"
                name="filtro-prioridade"
                value="todas"
                checked
              />
              <label for="filtro-prioridade-todas">Todas</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-prioridade-baixa"
                name="filtro-prioridade"
                value="baixa"
              />
              <label for="filtro-prioridade-baixa">Baixa</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-prioridade-media"
                name="filtro-prioridade"
                value="media"
              />
              <label for="filtro-prioridade-media">Média</label>
            </div>
            <div>
              <input
                type="radio"
                id="filtro-prioridade-alta"
                name="filtro-prioridade"
                value="alta"
              />
              <label for="filtro-prioridade-alta">Alta</label>
            </div>
          </fieldset>

          <div id="controles-extra">
            <div>
              <label for="ordenar-prazo">Ordenar por prazo</label>
              <select id="ordenar-prazo" name="ordenar-prazo">
                <option value="nenhuma">Sem ordenação</option>
                <option value="prazo-asc">Mais próximo primeiro</option>
                <option value="prazo-desc">Mais distante primeiro</option>
              </select>
            </div>

            <button type="button" id="limpar-filtros">Limpar filtros</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Quadro de tarefas</h2>

        <p id="status-tarefas" role="status" aria-live="polite"></p>

        <div id="colunas-tarefas">
          <section id="coluna-a-fazer" aria-labelledby="coluna-a-fazer-heading">
            <h3 id="coluna-a-fazer-heading">A fazer</h3>
            <ul></ul>
          </section>

          <section
            id="coluna-em-andamento"
            aria-labelledby="coluna-em-andamento-heading"
          >
            <h3 id="coluna-em-andamento-heading">Em andamento</h3>
            <ul></ul>
          </section>

          <section
            id="coluna-em-revisao"
            aria-labelledby="coluna-em-revisao-heading"
          >
            <h3 id="coluna-em-revisao-heading">Em revisão</h3>
            <ul></ul>
          </section>

          <section id="coluna-concluida" aria-labelledby="coluna-concluida-heading">
            <h3 id="coluna-concluida-heading">Concluída</h3>
            <ul></ul>
          </section>
        </div>
      </section>
    </main>

    <footer>
      <p>Flávio Júnior Leal Varnier</p>
      <p>Desenvolvimento Frontend — 2026.2</p>
    </footer>
    <script type="module" src="js/script.js"></script>
  </body>
</html>
